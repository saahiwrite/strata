name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Unit tests for all modules, plus every *IT in strata-healer (Testcontainers;
      # Docker is available on the runner). JaCoCo writes a coverage report per module.
      - name: mvn verify
        run: mvn -B verify

      - name: Coverage summary
        if: always()
        run: |
          echo "## Test coverage (JaCoCo)" >> "$GITHUB_STEP_SUMMARY"
          python3 .github/scripts/coverage_summary.py . | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: "**/target/site/jacoco/"
          if-no-files-found: warn

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Prometheus config and alert rules
        run: |
          docker run --rm -v "$PWD/infra/prometheus:/p" --entrypoint promtool prom/prometheus:v3.5.0 check config /p/prometheus.yml
          docker run --rm -v "$PWD/infra/prometheus:/p" -w /p/tests --entrypoint promtool prom/prometheus:v3.5.0 test rules alerts-test.yml

      - name: Check Alertmanager config
        run: docker run --rm -v "$PWD/infra/alertmanager:/a" --entrypoint amtool prom/alertmanager:v0.28.1 check-config /a/alertmanager.yml

      - name: Check docker-compose.yml
        run: cp .env.example .env && docker compose config -q
