# Alert rules for the target services (FR2).
# Every alert keeps the target's `service` and `container` labels, so the
# healer knows which service is broken and which container to act on.
groups:
  - name: strata-target-services
    rules:
      # The /actuator/prometheus scrape failed: the service crashed or is unreachable.
      # Only for a service that was up in the last 10 minutes, so a service that is
      # still starting (Spring Boot takes ~20s) doesn't get restarted by mistake.
      - alert: ServiceDown
        expr: up{job=~"order-service|inventory-service"} == 0 and max_over_time(up{job=~"order-service|inventory-service"}[10m]) == 1
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} is down"
          description: "Prometheus could not scrape {{ $labels.container }} ({{ $labels.instance }}) for 10s."

      # More than 20% of requests return 5xx over the last minute.
      # Actuator and /chaos/* calls are left out so health checks and
      # failure switches don't count as traffic.
      - alert: HighErrorRate
        expr: |
          (
            sum by (service, container) (rate(http_server_requests_seconds_count{job=~"order-service|inventory-service", status=~"5..", uri!~"/actuator.*|/chaos.*"}[1m]))
          /
            sum by (service, container) (rate(http_server_requests_seconds_count{job=~"order-service|inventory-service", uri!~"/actuator.*|/chaos.*"}[1m]))
          ) > 0.2
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} error rate is high"
          description: "{{ $value | humanizePercentage }} of requests to {{ $labels.container }} returned 5xx over the last minute."

      # p95 response time above 1s over the last minute (scenarios S08-S10).
      # Needs traffic: with no requests the quantile is NaN and nothing fires.
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (service, container, le) (rate(http_server_requests_seconds_bucket{job=~"order-service|inventory-service", uri!~"/actuator.*|/chaos.*"}[1m]))
          ) > 1
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} is responding slowly"
          description: "p95 response time of {{ $labels.container }} is {{ $value | humanizeDuration }} over the last minute."

      # Heap more than half full for 15s (scenarios S11-S12).
      # Pools with no limit report max = -1, so only pools with a real max count
      # in the denominator. In G1 that's the old gen, whose max is the heap size.
      # Why 50% and not 80%: measured on the Compose stack (490 MiB heap), the
      # /chaos/memory leak uses about 2 MiB of heap per MiB leaked (G1 humongous
      # regions) and the JVM hits OutOfMemoryError at about 80%. An idle service
      # sits under 10%, so 50% leaves time to act before the crash.
      - alert: HighMemory
        expr: |
          (
            sum by (service, container) (jvm_memory_used_bytes{job=~"order-service|inventory-service", area="heap"})
          /
            sum by (service, container) (jvm_memory_max_bytes{job=~"order-service|inventory-service", area="heap"} > 0)
          ) > 0.5
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} heap is almost full"
          description: "{{ $labels.container }} is using {{ $value | humanizePercentage }} of its heap."
