# Prometheus scrape config for STRATA.
# Short intervals so a crash is seen within seconds (Phase 1 performance goal).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Target services (Spring Boot Actuator + Micrometer). The `service` and
  # `container` labels are what the healer reads from each alert:
  # `service` is the Compose service, `container` is the Docker container to act on.
  # These show as down until the services are added to docker-compose.yml.
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order-service:8081"]
        labels:
          service: order-service
          container: strata-order-service-1

  - job_name: inventory-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["inventory-service:8082"]
        labels:
          service: inventory-service
          container: strata-inventory-service-1
