# Prometheus scrape config for STRATA.
# Short intervals so a crash is seen within seconds (Phase 1 performance goal).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Target services (Spring Boot Actuator + Micrometer). The `service` and
  # `container` labels are what the healer reads from each alert:
  # `service` is the Compose service, `container` is the Docker container to act on.
  # These show as down until the services are added to docker-compose.yml.
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order-service:8080"]
        labels:
          service: order-service
          container: strata-order-service-1

  - job_name: inventory-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["inventory-service:8080"]
        labels:
          service: inventory-service
          container: strata-inventory-service-1

  # The healer itself (#64): incidents, time to recovery, decisions per autonomy
  # level and source, approvals and earned autonomy. No `service`/`container`
  # labels on purpose, so no alert on these could ever send the healer to heal itself.
  - job_name: strata-healer
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["strata-healer:9000"]

  # Nginx, the entry point in front of both services (#45, S18). Prometheus can't
  # scrape Nginx itself, so the blackbox exporter probes /nginx-health and Prometheus
  # records probe_success. The labels are the same kind the healer reads from every
  # alert; nginx is not on the allow-list, so the healer only hands it to a human.
  - job_name: gateway
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://nginx:8080/nginx-health"]
        labels:
          service: nginx
          container: strata-nginx-1
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
