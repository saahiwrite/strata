# STRATA load balancer: one entry point on :8080 for both target services.
#
#   /orders...                 -> order-service:8081
#   /inventory...              -> inventory-service:8082
#   /order-service/...         -> order-service:8081/...     (chaos switches, actuator)
#   /inventory-service/...     -> inventory-service:8082/...
#
# Upstreams are resolved through Docker's DNS at request time (variables + resolver), so
# Nginx keeps running and comes back on its own while STRATA restarts a crashed service.
# A request that arrives while a service is down gets a JSON 502 instead of hanging.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    log_format json escape=json
        '{"timestamp":"$time_iso8601","service":"nginx","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"request_time":$request_time,"upstream":"$upstream_addr",'
        '"upstream_status":"$upstream_status","upstream_response_time":"$upstream_response_time"}';
    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    proxy_connect_timeout 2s;
    proxy_read_timeout    30s;
    proxy_http_version    1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 8080;

        set $order_service     http://order-service:8081;
        set $inventory_service http://inventory-service:8082;

        location = /nginx-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"UP"}';
        }

        location /orders {
            proxy_pass $order_service;
        }

        location /inventory {
            proxy_pass $inventory_service;
        }

        location /order-service/ {
            rewrite ^/order-service/(.*)$ /$1 break;
            proxy_pass $order_service;
        }

        location /inventory-service/ {
            rewrite ^/inventory-service/(.*)$ /$1 break;
            proxy_pass $inventory_service;
        }

        location / {
            default_type application/json;
            return 404 '{"error":"not found"}';
        }

        error_page 502 503 504 = @upstream_down;
        location @upstream_down {
            default_type application/json;
            return 502 '{"error":"upstream unavailable"}';
        }
    }
}
