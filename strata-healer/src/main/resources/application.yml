server:
  port: ${HEALER_PORT:9000}

spring:
  application:
    name: strata-healer

strata:
  loki:
    url: ${LOKI_URL:http://loki:3100}
  cooldown:
    seconds: 60
  verify:
    timeout-seconds: 30
  scale:
    max-instances: 3
  canary:
    verify-timeout-seconds: 60
  rollback:
    previous-image-label: strata.previous-image
