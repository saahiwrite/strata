server:
  port: ${HEALER_PORT:9000}

spring:
  application:
    name: strata-healer

strata:
  loki:
    url: ${LOKI_URL:http://loki:3100}
  cooldown:
    seconds: 60
  verify:
    timeout-seconds: 30
  # LLM diagnosis (FR3): only for alerts no rule in rules.yaml matches. Off unless enabled
  # (Docker Compose turns it on); when off or unreachable, such incidents go to a human.
  llm:
    enabled: ${STRATA_LLM_ENABLED:false}
    url: ${OLLAMA_URL:http://ollama:11434}
    model: ${STRATA_LLM_MODEL:qwen2.5:0.5b}
    timeout-seconds: 60
    # LLM proposals never count as more than 60% sure, so they always score riskier than a rule
    max-confidence: 0.6
  scale:
    max-instances: 3
  canary:
    verify-timeout-seconds: 60
  rollback:
    previous-image-label: strata.previous-image
