# STRATA stack. Start everything with:  docker compose up --build
# Copy .env.example to .env first (compose stops with an error if POSTGRES_PASSWORD is missing).
#
# The project name is fixed so container names are stable (strata-<service>-1)
# no matter what the checkout folder is called. The healer uses these names.
name: strata

services:
  # The healer. It restarts, scales out and rolls back containers through
  # docker-proxy, never through the Docker socket itself (#63).
  strata-healer:
    build: ./strata-healer
    ports:
      - "${HEALER_PORT:-9000}:9000"
    environment:
      HEALER_PORT: 9000
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-strata}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-strata}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (copy .env.example)}
      STRATA_PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      # A restarted Spring Boot service needs ~20-30s before it passes 3 checks in a row
      STRATA_VERIFY_TIMEOUT_SECONDS: 90
      # LLM diagnosis for errors no rule matches (needs the ollama service; see below)
      STRATA_LLM_ENABLED: "true"
      OLLAMA_URL: http://ollama:11434
      STRATA_LLM_MODEL: ${STRATA_LLM_MODEL:-qwen2.5:0.5b}
      DOCKER_HOST: tcp://docker-proxy:2375
    networks:
      - default
      - docker-api
    depends_on:
      postgres:
        condition: service_healthy
      docker-proxy:
        condition: service_started

  # Least privilege for the healer (#63). The Docker socket gives full control of
  # every container on the machine, so only this proxy mounts it, and it lets
  # through just the calls the healer's actions make:
  #   GET  /containers/json, /containers/{id}/json       list and inspect
  #   POST /containers/{id}/restart|start|stop           restart, scale out, rollback
  #   POST /containers/create, DELETE /containers/{id}   scale out and rollback (new copy, old one removed)
  #   POST /networks/{id}/connect|disconnect             put a new copy on the service's network
  # Everything else (images, volumes, build, system, swarm, events, /exec/*...) gets 403.
  # One gap: POST /containers/{id}/exec is allowed (it is under /containers), so an exec
  # can be created but not started (/exec/{id}/start is 403). See docs/qa/infra-tests.md D-1.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      POST: 1
      ALLOW_RESTARTS: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      EVENTS: 0
      PING: 1
      VERSION: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api

  # Local LLM for diagnosing errors no rule matches (FR3). Optional: start it with
  # `docker compose --profile llm up`. Without it the healer escalates unknown errors to a human.
  ollama:
    image: ollama/ollama:0.12.6
    profiles: [llm]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama

  # Downloads the model once (kept in the ollama-models volume), then exits.
  ollama-pull:
    image: ollama/ollama:0.12.6
    profiles: [llm]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${STRATA_LLM_MODEL:-qwen2.5:0.5b}"]
    depends_on:
      - ollama
    restart: on-failure

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-strata}
      POSTGRES_USER: ${POSTGRES_USER:-strata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (copy .env.example)}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    depends_on:
      - alertmanager
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Probes Nginx for Prometheus (#45, S18). Nginx has no metrics endpoint of its own,
  # so Prometheus asks this exporter to GET /nginx-health and reads probe_success.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./infra/blackbox:/etc/blackbox:ro

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./infra/alertmanager:/etc/alertmanager:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  loki:
    image: grafana/loki:3.5.0
    command: -config.file=/etc/loki/loki.yml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./infra/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Reads container logs through the Docker socket (read-only) and ships them to Loki.
  promtail:
    image: grafana/promtail:3.5.0
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./infra/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.0.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Anyone on localhost can view dashboards without logging in; editing needs admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/strata-services.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Target services that STRATA heals. Build the jars first (mvn clean package -DskipTests).
  # No restart policy on purpose: when a service crashes it stays down until the healer
  # restarts it. Their ports are not published; reach them through Nginx on :8080.
  order-service:
    build: ./target-services/order-service
    expose:
      - "8080"

  inventory-service:
    build: ./target-services/inventory-service
    expose:
      - "8080"

  # Single entry point: /orders, /inventory, and /order-service/* or /inventory-service/*
  # for the /chaos switches and /actuator (used by scenarios/inject.sh).
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8080}:8080"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - order-service
      - inventory-service
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  prometheus-data:
  loki-data:
  grafana-data:
  ollama-models:

networks:
  # Only the healer and docker-proxy are on this network, and it has no route
  # out, so nothing else can reach the proxy.
  docker-api:
    internal: true
